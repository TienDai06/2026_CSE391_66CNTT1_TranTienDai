<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="POST">
        <fieldset>
            <legend>Basic Info</legend>
        <label for="ID">Employee ID</label>
        <input type="number" id="ID" name ="ID" value=9 required><br><br>
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name ="lname"required><br><br>
        <label for="fname">First Name</label>
        <input type="text" id="fname" name ="fname"required><br><br>
        <label for="gender">Gender</label><br>
        <input type="radio" name="gender" value="male">Male<br>
        <input type="radio" name="gender" value="female">Female<br>
        <input type="radio" name="gender" value="xxx">XXX<br>
        <input type="radio" name="gender" value="zzz">ZZZ<br>
        
        <label for="title">Title</label>
        <input type="text" id="title" name="title"><br>
        <label for="suffix">Suffix</label>
        <input type="text" id="suffix" name="suffix" value="MR."><br>
        <label for="bdate">BirthDate</label>
        <input type="datetime-local" id="bdate" name="bdate"><br>
        <label for="hdate">HireDate</label>
        <input type="datetime-local" id="hdate" name="hdate"><br>
        <label for="ssn">SSN # (if applicable)</label>
        <input type="text" id="ssn" name="ssn"><br>
        <label>Reports To</label>
        <select name="reports_to">
            <option>Buchanan</option>
            <option>Babysark</option>
            <option>Leo</option>
        </select><br>
    </fieldset>
    <fieldset>
        <legend>Contact Info</legend>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required><br>
        <label for="address">Address</label>
        <input type="text" id="address" name="address" required><br>
        <label for="city">City</label>
        <input type="text" id="city" name="city" required><br>
        <label for="region">Region</label>
        <input type="text" id="region" name="region" required><br>
        <label for="pscode">Postal Code</label>
        <input type="text" id="pscode" name="pscode" required><br>
        <label for="country">Country</label>
        <select name="country">
            <option>Russian Federation</option>
            <option>UK</option>
            <option>Canada</option>
            <option>Australia</option>
        </select><br>
        <label for="USPhone">US Home Phone</label>
        <input type="tel" id="USPhone" name="USPhone" required><br>
        </label>
        <label for="photo">Photo</label>
        <input type="file" id="photo" name="photo"><br>
    </fieldset>
    <fieldset>
        <legend>Optional Info</legend>
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="5" cols="40"></textarea><br>
        <label for="Preshift">Preferred Shift</label>
        <input type="checkbox" name="Preshift" >Regular<br>
        <input type="checkbox" name="Preshift" >Gravy Yerd<br>
        <label for="Active">Active?</label>
        <input type="checkbox" name="Active"><br>
        <label>Are you human?</label>
        <input type="text" name="human" required><br>
    </fieldset>
    <button type="submit">Submit</button>
    <button type="cancel">Cancel</button>
    </form>
</body>
</html>
