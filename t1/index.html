<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý nhân sự</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="form.css" />
</head>
<body>
  <header class="header">
    <div class="header-left">
      <h1>Quản lý nhân sự</h1>
      <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Liên hệ</a>
      </nav>
    </div>
    <div class="header-right">
      <input type="text" id="search" placeholder="Tìm kiếm..." />
      <button id="btnAdd">+ Thêm mới</button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Danh sách nhân sự</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th>STT</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Số điện thoại</th>
            <th>Ngày sinh</th>
            <th>Vị trí</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Data will be populated by JavaScript from data.js -->
        </tbody>
      </table>
    </section>
  </main>

  <!-- Modal Form -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Thêm nhân sự mới</h3>
        <button id="closeModal" class="close-btn">×</button>
      </div>
      <form id="employeeForm" class="modal-body" novalidate>
        <div class="form-row">
          <label for="name">Họ tên <span class="required">*</span></label>
          <input type="text" id="name" name="name" placeholder="Nhập họ tên" maxlength="30" required />
          <span id="nameError" class="error-message"></span>
        </div>

        <div class="form-row">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="Nhập email" required />
          <span id="emailError" class="error-message"></span>
        </div>

        <div class="form-row">
          <label for="phone">Số điện thoại <span class="required">*</span></label>
          <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" pattern="[0-9]{10}" required />
          <span id="phoneError" class="error-message"></span>
        </div>

        <div class="form-row">
          <label for="position">Vị trí <span class="required">*</span></label>
          <select id="position" name="position" required>
            <option value="">-- Chọn vị trí --</option>
            <option value="Nhân viên">Nhân viên</option>
            <option value="Quản lý">Quản lý</option>
            <option value="Giám đốc">Giám đốc</option>
          </select>
          <span id="positionError" class="error-message"></span>
        </div>

        <div class="form-row full-row gender-row">
          <span>Giới tính</span>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="Nam" checked /> Nam</label>
            <label><input type="radio" name="gender" value="Nữ" /> Nữ</label>
          </div>
        </div>
        
        <div class="form-row">
          <label for="birthdate">Ngày sinh</label>
          <input type="date" id="birthdate" name="birthdate" />
        </div>

        <div class="form-row">
          <label for="password">Mật khẩu <span class="required">*</span></label>
          <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required />
          <span id="passwordError" class="error-message"></span>
        </div>
        <div class="modal-footer full-row">
          <button type="submit" class="btn save">Lưu</button>
          <button type="button" id="cancelBtn" class="btn cancel">Hủy</button>
        </div>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
