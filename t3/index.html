<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Management</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="modal.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Book Management</h1>
      <p class="subtitle">Thử nghiệm giao diện HTML + CSS (tĩnh)</p>
    </header>

    <main>
      <section class="stats">
        <div class="card"><h3>Total Books</h3><p>245</p></div>
        <div class="card"><h3>Latest Book</h3><p>1Q84</p></div>
        <div class="card"><h3>Favorite Author</h3><p>Victor Hugo</p></div>
      </section>

      <section class="actions">
        <button id="btnAdd" class="btn-primary">+ Thêm mới</button>
      </section>

      <section class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Tên sách</th>
              <th>Tên tác giả</th>
              <th>Số điện thoại</th>
              <th>Chủ đề</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="booksTableBody">
            
          </tbody>
        </table>
      </section>
    </main>
  </div>
<!-- Form  Pop UP -->
  <div id="popupForm" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Thêm sách mới</h2>
      </div>
      <form id="bookForm" novalidate>
        <div class="form-group">
            <label for="nameBook">Tên sách</label>
            <input id="nameBook" name="nameBook" type="text" minlength="2" maxlength="100" required />
            <div class="error-message"></div>
        </div>
        <div class="form-group">
            <label for="authorName">Tên tác giả</label>
            <input id="authorName" name="authorName" type="text" minlength="3" maxlength="50" required />
            <div class="error-message"></div>
        </div>
        <div class="form-group">
            <label for="phone">Số điện thoại</label>
            <input id="phone" name="phone" type="tel" pattern="^[0-9]{10}$" minlength="10" maxlength="10" required />
            <div class="error-message"></div>
        </div>
        <div class="form-group">
            <label for="topic">Chủ đề</label>
            <input id="topic" name="topic" type="text" minlength="2" maxlength="50" required />
            <div class="error-message"></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Submit</button>
          <button type="button" id="btnCancel" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
