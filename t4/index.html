<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Employees - TLU</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
                <h1>TLU</h1>
                <div class="search-bar">
                    <input type="text" placeholder="Search">
                    <button class="search-btn">Search</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Title and Action Buttons -->
            <div class="section-header">
                <h2>Manage Employees</h2>
                <div class="action-buttons">
                    <button class="btn btn-danger" id="deleteBtn">
                        <span class="icon">🗑</span> Delete
                    </button>
                    <button class="btn btn-success" id="addBtn">
                        <span class="icon">➕</span> Add New Employee
                    </button>
                </div>
            </div>

            <!-- Employees Table -->
            <table class="employees-table">
                <thead>
                    <tr>
                        <th><input type="checkbox"></th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Address</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeesTableBody">
                    <!-- Rendered dynamically from data.js -->
                </tbody>
            </table>

            <!-- Pagination -->
            <div class="pagination">
                <span class="pagination-info">Showing 5 out of 25 entries</span>
                <div class="pagination-controls">
                    <button class="pagination-btn prev-btn">Previous</button>
                    <button class="pagination-page active">1</button>
                    <button class="pagination-page">2</button>
                    <button class="pagination-page">3</button>
                    <button class="pagination-page">4</button>
                    <button class="pagination-page">5</button>
                    <button class="pagination-btn next-btn">Next</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Employee Modal/Popup -->
    <div id="addEmployeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Employee</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="addEmployeeForm" class="form">
                <!-- Error Notification Banner -->
                <div id="errorBanner" class="error-banner" style="display: none;">
                    <div class="error-icon">⚠️</div>
                    <div class="error-content">
                        <h4>Validation Error</h4>
                        <ul id="errorList"></ul>
                    </div>
                </div>

                <div class="form-group">
                    <label for="employeeName">Name</label>
                    <input type="text" id="employeeName" name="name" placeholder="Enter employee name" maxlength="30" required>
                    <span class="error-message" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="employeeEmail">Email</label>
                    <input type="email" id="employeeEmail" name="email" placeholder="Enter employee email" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="employeeAddress">Address</label>
                    <textarea id="employeeAddress" name="address" placeholder="Enter employee address" rows="3" minlength="4" required></textarea>
                    <span class="error-message" id="addressError"></span>
                </div>

                <div class="form-group">
                    <label for="employeePhone">Phone</label>
                    <input type="tel" id="employeePhone" name="phone" placeholder="Enter 10-digit phone number" minlength="10" maxlength="10" required>
                    <span class="error-message" id="phoneError"></span>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-success">Add</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
