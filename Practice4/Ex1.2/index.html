<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="box">
            <label for="name">Họ và tên</label>
            <input type="text" id="name" name="name" placeholder="Nhập họ và tên"></br>
            <label for="score">Điểm</label>
            <input type="number" id="score" name="score" min="0" max="10" placeholder="Nhập điểm">
            <button id="addBtn">Thêm</button>
        </div>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên...">

            <select id="rankFilter">
                <option value="all">Tất cả</option>
                <option value="Giỏi">Giỏi</option>
                <option value="Khá">Khá</option>
                <option value="Trung bình">Trung bình</option>
                <option value="Yếu">Yếu</option>
            </select>
        </div>
        <div class="boxtable">
            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Họ và tên</th>
                        <th id = 'scoreHeader'>Điểm</th>
                        <th>Xếp loại</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    
                </tbody>
            </table>
            <div id="stats">Tổng số sinh viên: 0 | Điểm trung bình: 0.0</div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
