<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Danh Bạ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="container-header">
        <h1>Quản Lý Danh Bạ</h1>
        <div class="header-controls">
            <label for="categoryLanguage"></label>
            <select id="categoryLanguage" class="categoryLanguage">
                <option value="">Tiếng việt</option>
                <option value="English">Tiếng anh</option>
            </select>
            <button class="add-btn">Thêm liên hệ</button>
        </div>
    </div>
    <div class="grid">
        <!-- DANH SÁCH -->
        <div class="card">
            <h2>Danh Sách Liên Hệ</h2>
            <input type="text" id="search" placeholder="Tìm kiếm liên hệ...">

            <div id="contactList"></div>
        </div>

        <!-- FORM -->
        <div class="card">
            <h2>Thêm Liên Hệ Mới</h2>

            <form id="contactForm">
                <div class="row">
                    <div>
                        <label for="firstName">Tên</label>
                        <input type="text" id="firstName" placeholder="Tên">
                        <small class="error"></small>
                    </div>
                    <div>
                        <label for="lastName">Họ</label>
                        <input type="text" id="lastName" placeholder="Họ">
                        <small class="error"></small>
                    </div>
                </div>

                <label for="phone">Số điện thoại</label>
                <input type="text" id="phone" placeholder="Số điện thoại">
                <small class="error"></small>
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Email">
                <small class="error"></small>
                <label for="address">Địa chỉ</label>
                <input type="text" id="address" placeholder="Địa chỉ">
                <small class="error"></small>
                <label for="company">Công ty</label>
                <input type="text" id="company" placeholder="Công ty">
                <small class="error"></small>

                <label for="category">Danh mục</label>
                <select id="category">
                    <option value="">Chọn danh mục</option>
                    <option>Công việc</option>
                    <option>Gia đình</option>
                    <option>Bạn bè</option>
                </select>

                <div class="btn-group">
                    <button type="submit">Thêm Liên Hệ</button>
                    <button type="reset">Hủy Bỏ</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
