<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Flexbox & Grid Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER (Flexbox) -->
    <header class="header">
        <h1>My Website</h1>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- MAIN LAYOUT (Grid) -->
    <div class="container">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h3>Sidebar</h3>
            <ul>
                <li>Menu 1</li>
                <li>Menu 2</li>
                <li>Menu 3</li>
            </ul>
        </aside>

        <!-- CONTENT -->
        <main class="content">
            <h2>Content Area</h2>

            <!-- CARD LIST (Flexbox) -->
            <div class="card-list">
                <div class="card">Card 1</div>
                <div class="card">Card 2</div>
                <div class="card">Card 3</div>
                <div class="card">Card 4</div>
            </div>

            <!-- GRID ITEMS -->
            <div class="grid-box">
                <div class="grid-item">1</div>
                <div class="grid-item">2</div>
                <div class="grid-item">3</div>
                <div class="grid-item">4</div>
                <div class="grid-item">5</div>
                <div class="grid-item">6</div>
            </div>



            <!-- Bản 2 -->
             <!-- AUTO GRID -->
            <h3>Auto Grid</h3>
            <div class="auto-grid">
                <div class="auto-item">1</div>
                <div class="auto-item">2</div>
                <div class="auto-item">3</div>
                <div class="auto-item">4</div>
            </div>

            <!-- CENTER -->
            <h3>Center Box</h3>
            <div class="center-box">
                <p>Center me</p>
            </div>

            <!-- FLEX COLUMN -->
            <h3>Flex Column</h3>
            <div class="flex-column">
                <div>A</div>
                <div>B</div>
                <div>C</div>
            </div>

            <!-- GRID SPAN -->
            <h3>Grid Span</h3>
            <div class="grid-span">
                <div class="big">Big</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
            </div>
        </main>

    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p>Footer</p>
    </footer>

</body>
</html>
